name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Use `npm install` instead of `npm ci` to work around the known npm
      # lockfile issue with platform-specific optional deps (rollup/esbuild)
      # when the lockfile is generated on Windows.
      - name: Install dependencies (front)
        run: npm install --no-audit --no-fund

      - name: Install dependencies (api)
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check (front)
        run: npx tsc -b --noEmit

      - name: Type-check (api)
        working-directory: api
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Only runtime dependencies gate the build: they are the ones actually
      # shipped to users. Build/test tooling is reported below but does not
      # block, since upstream fixes often lag behind the advisories.
      - name: Audit runtime deps (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit api (high+)
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: Audit build tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
